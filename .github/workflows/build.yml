name: Test and build

# Runs the headless test suite, then exports Linux, Windows and macOS builds.
# Every run uploads the builds as workflow artifacts; pushing a tag like v0.2.0
# also attaches them to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/macos.zip -d "$dest"
          rm templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Run tests
        run: ~/godot/godot --headless --path . res://tests/test_runner.tscn

      - name: Export builds
        run: |
          mkdir -p build/linux build/windows build/macos
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/TheChosenLine.x86_64
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/TheChosenLine.exe
          ~/godot/godot --headless --path . --export-release "macOS" build/macos/TheChosenLine-macOS.zip
          cd build
          (cd linux && zip -q ../TheChosenLine-Linux.zip TheChosenLine.x86_64)
          (cd windows && zip -q ../TheChosenLine-Windows.zip TheChosenLine.exe)
          cp macos/TheChosenLine-macOS.zip TheChosenLine-macOS.zip
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: TheChosenLine-builds
          path: build/TheChosenLine-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TheChosenLine-*.zip
